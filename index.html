<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🍍 Pineapple Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:      #0e0e10;
  --surface: #18181c;
  --surface2:#222228;
  --lime:    #caff4d;
  --lime2:   #b0e832;
  --text:    #f0f0ee;
  --sub:     #8a8a90;
  --border:  rgba(202,255,77,0.12);
  --radius:  12px;
  --pill:    999px;
  --font:    'Space Grotesk', system-ui, sans-serif;
  --mono:    'Space Mono', monospace;
  --t: 0.18s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* NAV */
nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;
  background:rgba(14,14,16,0.88);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.brand{font-family:var(--mono);font-weight:700;font-size:1rem;color:var(--lime);letter-spacing:-0.02em;white-space:nowrap;}
.search-wrap{flex:1;position:relative;max-width:520px;}
.search-wrap input{
  width:100%;padding:9px 40px 9px 16px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--pill);
  color:var(--text);font-family:var(--font);font-size:0.88rem;outline:none;
  transition:border-color var(--t),box-shadow var(--t);
}
.search-wrap input:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(202,255,77,0.12);}
.search-wrap input::placeholder{color:var(--sub);}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none;font-size:14px;}
.nav-tabs{display:flex;gap:4px;margin-left:auto;}
.tab-btn{
  padding:7px 16px;border-radius:var(--pill);border:none;
  font-family:var(--font);font-size:0.82rem;font-weight:600;cursor:pointer;
  background:transparent;color:var(--sub);transition:all var(--t);
}
.tab-btn.active,.tab-btn:hover{background:var(--surface2);color:var(--text);}
.tab-btn.active{color:var(--lime);}

/* MAIN */
main{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}

/* PAGE HEADER */
.page-header{margin-bottom:24px;}
.page-header h1{font-size:1.5rem;font-weight:700;letter-spacing:-0.02em;color:var(--text);}
.page-header p{color:var(--sub);font-size:0.85rem;margin-top:4px;}

/* SOUND GRID */
.sound-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
}
.sound-btn{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:18px 12px 14px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
  transition:all var(--t);
  text-align:center;min-height:100px;
  overflow:hidden;
  user-select:none;
}
.sound-btn:hover{border-color:var(--lime);background:var(--surface2);transform:translateY(-2px);box-shadow:0 4px 20px rgba(202,255,77,0.1);}
.sound-btn.playing{border-color:var(--lime);background:var(--surface2);box-shadow:0 0 0 2px var(--lime);}
.sound-btn.playing .btn-dot{background:var(--lime);animation:pulse 1s infinite;}
.btn-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--sub);flex-shrink:0;
  transition:background var(--t);
}
.btn-label{
  font-size:0.78rem;font-weight:600;line-height:1.3;
  color:var(--text);word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.btn-play-icon{
  position:absolute;bottom:8px;right:10px;
  font-size:10px;color:var(--sub);
  transition:color var(--t);
}
.sound-btn:hover .btn-play-icon,.sound-btn.playing .btn-play-icon{color:var(--lime);}
.wave-wrap{display:flex;align-items:center;gap:2px;height:18px;}
.wave-bar{
  width:3px;border-radius:2px;background:var(--sub);
  transition:background var(--t);
}
.sound-btn.playing .wave-bar{background:var(--lime);animation:wave 0.8s ease-in-out infinite;}
.wave-bar:nth-child(2){animation-delay:0.1s;}
.wave-bar:nth-child(3){animation-delay:0.2s;}
.wave-bar:nth-child(4){animation-delay:0.15s;}
.wave-bar:nth-child(5){animation-delay:0.05s;}
@keyframes wave{0%,100%{height:4px;}50%{height:16px;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* LOADING / EMPTY */
.loading-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;gap:16px;color:var(--sub);
}
.spinner{
  width:32px;height:32px;border:3px solid var(--surface2);
  border-top-color:var(--lime);border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-msg{font-size:1rem;font-weight:500;color:var(--sub);}
.empty-sub{font-size:0.82rem;color:var(--sub);opacity:0.6;margin-top:4px;text-align:center;}

/* LOAD MORE */
.load-more-wrap{display:flex;justify-content:center;margin-top:28px;}
.load-more-btn{
  padding:11px 32px;border-radius:var(--pill);
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--text);font-family:var(--font);font-size:0.86rem;font-weight:600;
  cursor:pointer;transition:all var(--t);
}
.load-more-btn:hover{border-color:var(--lime);color:var(--lime);background:var(--surface2);}
.load-more-btn:disabled{opacity:0.4;pointer-events:none;}

/* NOW PLAYING BAR */
#now-playing{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(18,18,20,0.96);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:10px 20px;
  display:flex;align-items:center;gap:14px;
  transform:translateY(100%);transition:transform var(--t);
  z-index:200;
}
#now-playing.visible{transform:translateY(0);}
.np-dot{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:pulse 1s infinite;flex-shrink:0;}
.np-label{font-size:0.82rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.np-stop{
  padding:6px 16px;border-radius:var(--pill);
  background:rgba(202,255,77,0.1);border:1px solid rgba(202,255,77,0.3);
  color:var(--lime);font-family:var(--font);font-size:0.78rem;font-weight:600;
  cursor:pointer;transition:all var(--t);flex-shrink:0;
}
.np-stop:hover{background:rgba(202,255,77,0.2);}

/* FAVORITES header toggle */
.fav-section-title{
  font-size:0.78rem;font-weight:700;color:var(--sub);
  letter-spacing:0.08em;margin-bottom:14px;margin-top:28px;
  display:flex;align-items:center;gap:8px;
}
.fav-section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* Toast */
.toast-area{position:fixed;top:70px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 18px;
  font-size:0.82rem;font-weight:500;color:var(--text);
  animation:toastIn 0.22s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}

/* Responsive */
@media(max-width:640px){
  .sound-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
  .nav-tabs{display:none;}
  .mobile-tabs{display:flex;gap:6px;margin-bottom:20px;}
}
@media(min-width:641px){.mobile-tabs{display:none;}}
.mobile-tabs .tab-btn{flex:1;text-align:center;}
</style>
</head>
<body>

<nav>
  <span class="brand">🍍 pineapple board</span>
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="Search myinstants…" autocomplete="off"/>
    <span class="search-icon">⌕</span>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn active" data-tab="trending">Trending</button>
    <button class="tab-btn" data-tab="search">Search</button>
    <button class="tab-btn" data-tab="favorites">Favorites ♥</button>
  </div>
</nav>

<main>
  <!-- Mobile tabs -->
  <div class="mobile-tabs">
    <button class="tab-btn active" data-tab="trending">Trending</button>
    <button class="tab-btn" data-tab="search">Search</button>
    <button class="tab-btn" data-tab="favorites">♥</button>
  </div>

  <div id="trending-page">
    <div class="page-header">
      <h1>Trending in US 🔥</h1>
      <p>Top sounds right now — pulled live from myinstants.com</p>
    </div>
    <div id="trending-grid" class="sound-grid"></div>
    <div id="trending-loading" class="loading-wrap"><div class="spinner"></div></div>
    <div class="load-more-wrap" id="trending-more-wrap" style="display:none">
      <button class="load-more-btn" id="trending-more-btn">Load more</button>
    </div>
  </div>

  <div id="search-page" style="display:none">
    <div class="page-header">
      <h1 id="search-title">Search results</h1>
      <p id="search-sub">Type something above to search</p>
    </div>
    <div id="search-grid" class="sound-grid"></div>
    <div id="search-loading" class="loading-wrap" style="display:none"><div class="spinner"></div></div>
    <div class="load-more-wrap" id="search-more-wrap" style="display:none">
      <button class="load-more-btn" id="search-more-btn">Load more</button>
    </div>
  </div>

  <div id="favorites-page" style="display:none">
    <div class="page-header">
      <h1>Favorites ♥</h1>
      <p>Sounds you've saved — stored locally in your browser</p>
    </div>
    <div id="favorites-grid" class="sound-grid"></div>
    <div id="favorites-empty" class="loading-wrap" style="display:none">
      <span class="empty-msg">No favorites yet</span>
      <span class="empty-sub">Tap ♥ on any sound to save it here</span>
    </div>
  </div>
</main>

<div id="now-playing">
  <div class="np-dot"></div>
  <div class="np-label" id="np-label">—</div>
  <button class="np-stop" id="np-stop">■ Stop</button>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
// ─── State ─────────────────────────────────────────────────────────
const PROXY = 'https://api.allorigins.win/get?url=';
let currentAudio = null;
let currentBtn = null;
let currentTab = 'trending';
let favorites = JSON.parse(localStorage.getItem('pb_favs') || '[]');

// Page state
let trendingPage = 1, trendingLoading = false, trendingDone = false;
let searchPage = 1, searchLoading = false, searchDone = false;
let currentQuery = '';

// ─── DOM refs ───────────────────────────────────────────────────────
const trendingGrid = document.getElementById('trending-grid');
const searchGrid   = document.getElementById('search-grid');
const favGrid      = document.getElementById('favorites-grid');
const npBar        = document.getElementById('now-playing');
const npLabel      = document.getElementById('np-label');
const searchInput  = document.getElementById('searchInput');

// ─── Tab switching ──────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('trending-page').style.display  = tab === 'trending'  ? '' : 'none';
  document.getElementById('search-page').style.display    = tab === 'search'    ? '' : 'none';
  document.getElementById('favorites-page').style.display = tab === 'favorites' ? '' : 'none';
  if (tab === 'favorites') renderFavorites();
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

// ─── Fetch myinstants page via allorigins proxy ─────────────────────
async function fetchInstantsPage(url) {
  const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxyUrl);
  const data = await res.json();
  return data.contents; // HTML string
}

// ─── Parse sounds from myinstants HTML ─────────────────────────────
function parseSounds(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const sounds = [];
  doc.querySelectorAll('.instant').forEach(el => {
    const btn = el.querySelector('button.small-button');
    const link = el.querySelector('a.instant-link');
    if (!btn || !link) return;
    const onclick = btn.getAttribute('onclick') || '';
    const m = onclick.match(/play\('([^']+)'/);
    if (!m) return;
    const audioPath = m[1];
    const audioUrl = 'https://www.myinstants.com' + audioPath;
    const name = link.textContent.trim();
    sounds.push({ name, url: audioUrl });
  });
  return sounds;
}

// ─── Build a sound button ───────────────────────────────────────────
function makeSoundBtn(sound) {
  const isFav = favorites.some(f => f.url === sound.url);

  const btn = document.createElement('div');
  btn.className = 'sound-btn';
  btn.title = sound.name;

  const wave = document.createElement('div');
  wave.className = 'wave-wrap';
  [4,10,16,10,6].forEach(h => {
    const b = document.createElement('div');
    b.className = 'wave-bar';
    b.style.height = h + 'px';
    wave.appendChild(b);
  });

  const label = document.createElement('div');
  label.className = 'btn-label';
  label.textContent = sound.name;

  const playIcon = document.createElement('div');
  playIcon.className = 'btn-play-icon';
  playIcon.textContent = '▶';

  const favBtn = document.createElement('button');
  favBtn.style.cssText = `position:absolute;top:6px;right:8px;background:none;border:none;cursor:pointer;font-size:12px;color:${isFav?'#ff6b8a':'var(--sub)'};padding:2px;line-height:1;transition:color 0.15s;`;
  favBtn.textContent = isFav ? '♥' : '♡';
  favBtn.title = isFav ? 'Remove from favorites' : 'Add to favorites';
  favBtn.addEventListener('click', e => {
    e.stopPropagation();
    toggleFav(sound, favBtn);
  });

  btn.appendChild(wave);
  btn.appendChild(label);
  btn.appendChild(playIcon);
  btn.appendChild(favBtn);

  btn.addEventListener('click', () => playSound(sound, btn, playIcon));
  return btn;
}

// ─── Play audio ─────────────────────────────────────────────────────
function playSound(sound, btn, iconEl) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
    if (currentBtn) {
      currentBtn.classList.remove('playing');
      const ic = currentBtn.querySelector('.btn-play-icon');
      if (ic) ic.textContent = '▶';
    }
    if (currentBtn === btn) { currentBtn = null; npBar.classList.remove('visible'); return; }
  }

  const audio = new Audio(sound.url);
  currentAudio = audio;
  currentBtn = btn;
  btn.classList.add('playing');
  if (iconEl) iconEl.textContent = '■';

  npLabel.textContent = sound.name;
  npBar.classList.add('visible');

  audio.play().catch(() => toast('Could not load audio'));
  audio.addEventListener('ended', () => {
    btn.classList.remove('playing');
    if (iconEl) iconEl.textContent = '▶';
    currentAudio = null; currentBtn = null;
    npBar.classList.remove('visible');
  });
}

document.getElementById('np-stop').addEventListener('click', () => {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentBtn) { currentBtn.classList.remove('playing'); const ic = currentBtn.querySelector('.btn-play-icon'); if(ic) ic.textContent='▶'; currentBtn = null; }
  npBar.classList.remove('visible');
});

// ─── Favorites ──────────────────────────────────────────────────────
function toggleFav(sound, btn) {
  const idx = favorites.findIndex(f => f.url === sound.url);
  if (idx >= 0) {
    favorites.splice(idx, 1);
    btn.textContent = '♡'; btn.style.color = 'var(--sub)';
    btn.title = 'Add to favorites';
    toast('Removed from favorites');
  } else {
    favorites.push(sound);
    btn.textContent = '♥'; btn.style.color = '#ff6b8a';
    btn.title = 'Remove from favorites';
    toast('Added to favorites ♥');
  }
  localStorage.setItem('pb_favs', JSON.stringify(favorites));
  // refresh fav page if visible
  if (currentTab === 'favorites') renderFavorites();
}

function renderFavorites() {
  favGrid.innerHTML = '';
  const empty = document.getElementById('favorites-empty');
  if (!favorites.length) { empty.style.display = 'flex'; return; }
  empty.style.display = 'none';
  favorites.forEach(s => favGrid.appendChild(makeSoundBtn(s)));
}

// ─── Trending ────────────────────────────────────────────────────────
async function loadTrending() {
  if (trendingLoading || trendingDone) return;
  trendingLoading = true;

  const loadingEl = document.getElementById('trending-loading');
  const moreWrap = document.getElementById('trending-more-wrap');
  const moreBtn = document.getElementById('trending-more-btn');

  loadingEl.style.display = 'flex';
  moreWrap.style.display = 'none';
  moreBtn.disabled = true;

  try {
    const url = `https://www.myinstants.com/en/index/us/?page=${trendingPage}`;
    const html = await fetchInstantsPage(url);
    const sounds = parseSounds(html);

    loadingEl.style.display = 'none';

    if (!sounds.length) {
      trendingDone = true;
      if (trendingPage === 1) {
        trendingGrid.innerHTML = '<div class="loading-wrap"><span class="empty-msg">Could not load sounds</span><span class="empty-sub">Check your connection or try refreshing</span></div>';
      }
      return;
    }

    sounds.forEach(s => trendingGrid.appendChild(makeSoundBtn(s)));
    trendingPage++;
    moreWrap.style.display = 'flex';
    moreBtn.disabled = false;
  } catch(e) {
    loadingEl.style.display = 'none';
    if (trendingPage === 1) {
      trendingGrid.innerHTML = `<div class="loading-wrap"><span class="empty-msg">Failed to load</span><span class="empty-sub">${e.message}</span></div>`;
    }
  }
  trendingLoading = false;
}

document.getElementById('trending-more-btn').addEventListener('click', loadTrending);

// ─── Search ──────────────────────────────────────────────────────────
async function doSearch(query, reset = true) {
  if (!query || query.length < 2) return;
  if (reset) {
    searchPage = 1;
    searchDone = false;
    searchGrid.innerHTML = '';
  }
  if (searchLoading || searchDone) return;
  searchLoading = true;

  currentQuery = query;
  switchTab('search');

  const loadingEl = document.getElementById('search-loading');
  const moreWrap  = document.getElementById('search-more-wrap');
  const moreBtn   = document.getElementById('search-more-btn');
  const titleEl   = document.getElementById('search-title');
  const subEl     = document.getElementById('search-sub');

  titleEl.textContent = `Results for "${query}"`;
  subEl.textContent   = 'Searching myinstants.com…';
  loadingEl.style.display = 'flex';
  moreWrap.style.display = 'none';

  try {
    const url = `https://www.myinstants.com/en/search/?name=${encodeURIComponent(query)}&page=${searchPage}`;
    const html = await fetchInstantsPage(url);
    const sounds = parseSounds(html);

    loadingEl.style.display = 'none';

    if (!sounds.length) {
      searchDone = true;
      if (searchPage === 1) {
        searchGrid.innerHTML = '';
        subEl.textContent = 'No results found — try different keywords';
      } else {
        subEl.textContent = `${searchGrid.children.length} results`;
      }
      return;
    }

    sounds.forEach(s => searchGrid.appendChild(makeSoundBtn(s)));
    subEl.textContent = `${searchGrid.children.length} results`;
    searchPage++;
    moreWrap.style.display = 'flex';
    moreBtn.disabled = false;
  } catch(e) {
    loadingEl.style.display = 'none';
    subEl.textContent = 'Search failed — try again';
  }
  searchLoading = false;
}

document.getElementById('search-more-btn').addEventListener('click', () => doSearch(currentQuery, false));

let searchDebounce;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const q = searchInput.value.trim();
  if (q.length < 2) return;
  searchDebounce = setTimeout(() => doSearch(q, true), 500);
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(searchDebounce);
    const q = searchInput.value.trim();
    if (q.length >= 2) doSearch(q, true);
  }
});

// ─── Toast ───────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastArea').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// ─── Init ────────────────────────────────────────────────────────────
loadTrending();
</script>
</body>
</html>
